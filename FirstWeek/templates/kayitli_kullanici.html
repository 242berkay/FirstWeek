<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıtlı Kullanıcı Bilgileri</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 90px;
            background-color: #f1f3f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container-box {
            max-width: 500px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        h2 {
            margin-bottom: 25px;
            color: #2c3e50;
            font-weight: 600;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
        }
        .navbar {
            background-color: #2c3e50;
        }
        .navbar-brand {
            color: #fff !important;
            font-weight: 600;
            display: flex;
            align-items: center;
        }
        .navbar-brand img {
            margin-right: 10px;
            height: 28px;
        }
        .nav-link {
            color: #fff !important;
        }
        .user-info {
            text-align: left;
            margin-top: 20px;
        }
        .user-info p {
            font-size: 16px;
            color: #2c3e50;
        }
        .empty-field {
            border: 1px solid #ccc;
            padding: 8px;
            background-color: #f9f9f9;
            color: #aaa;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('ana_sayfa') }}">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Müze Logosu">
        </a>
        <div class="collapse navbar-collapse justify-content-end">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('ana_sayfa') }}">Ana Sayfa</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-box">
    <h2>Kullanıcı Bilgileri</h2>

    <!-- Kullanıcı Bilgileri Gösterimi -->
    <div class="user-info">
        <p><strong>Adı:</strong> <span class="empty-field">Boş Alan</span></p>
        <p><strong>Soyadı:</strong> <span class="empty-field">Boş Alan</span></p>
        <p><strong>Rezervasyon Tarihi:</strong> <span class="empty-field">Boş Alan</span></p>
        <p><strong>Rezervasyon Saati:</strong> <span class="empty-field">Boş Alan</span></p>
    </div>

    <a href="{{ url_for('ana_sayfa') }}" class="btn btn-primary">Ana Sayfaya Dön</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
