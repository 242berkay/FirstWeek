<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıtlı Ziyaretçiler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 60px;
        }
        h2 {
            margin-bottom: 30px;
            font-size: 1.8rem;
            text-align: center;
        }
        table {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('ana_sayfa') }}">Müze Yönetim</a>
            <a href="{{ url_for('admin_paneli') }}" class="btn btn-outline-light btn-sm">Geri</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="text-center">Kayıtlı Ziyaretçiler</h2>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Ad</th>
                    <th>Soyad</th>
                    <th>Rezervasyon Tarihi</th>
                </tr>
            </thead>
            <tbody>
                {% for ziyaretci in ziyaretciler %}
                <tr>
                    <td>{{ ziyaretci.id }}</td>
                    <td>{{ ziyaretci.ad }}</td>
                    <td>{{ ziyaretci.soyad }}</td>
                    <td>{{ ziyaretci.rezervasyon }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
